version: '3.8'

services:
  backend:
    build: .
    container_name: electronic_erp_backend

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

    volumes:
      - .:/app
      - /app/node_modules

    stdin_open: true
    tty: true

    command: npm run start:dev

    develop:
      watch:
        - action: sync
          path: .
          target: /app

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    container_name: electronic_erp_db

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      timeout: 5s
      retries: 5

volumes:
  mysql_data: